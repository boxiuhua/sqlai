server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有 non-asset 请求都回 index.html
    location / {
        try_files $uri /index.html;
    }

    # API 反代到 host 上的 sqlai-api（容器外的 :8080）
    # 关 buffering 才能让 SSE 实时透传。
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
