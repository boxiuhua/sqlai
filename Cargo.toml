[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bxh"]

[workspace.dependencies]
# 领域基础
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 异步 / 网络
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"

# SQL / DB
sqlparser   = "0.51"
url         = "2"
sqlx        = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector              = { version = "0.4", features = ["sqlx"] }
testcontainers        = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# 内部 crate（path 依赖）
sqlai-core      = { path = "crates/sqlai-core" }
sqlai-dialect   = { path = "crates/sqlai-dialect" }
sqlai-llm       = { path = "crates/sqlai-llm" }
sqlai-exec      = { path = "crates/sqlai-exec" }
sqlai-store     = { path = "crates/sqlai-store" }
sqlai-skills    = { path = "crates/sqlai-skills" }
sqlai-pipeline  = { path = "crates/sqlai-pipeline" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
